services:
  web:
    image: nginx:alpine
    container_name: untitledproject-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  discordbot:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ctf-bot
    restart: unless-stopped
    env_file:
      - ../.env
    working_dir: /app